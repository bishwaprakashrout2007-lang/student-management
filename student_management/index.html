<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
      .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
      .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); }
      h1 { margin-top: 0; color: #2563eb; }
      p { line-height: 1.6; }
      .chip { display: inline-block; background: #dbeafe; color: #1d4ed8; padding: 8px 12px; border-radius: 999px; font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <span class="chip">Student Management</span>
        <h1>Welcome to the Student Management Page</h1>
        <p>This HTML page was added to the student_management folder as requested.</p>
        <p>You can use this file as a simple landing page or extend it with your student dashboard UI.</p>
      </section>
    </main>
  </body>
</html>
